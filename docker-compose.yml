name: zipimoney

services:
  postgres:
    image: postgres:16-alpine
    container_name: zipimoney-postgres
    environment:
      POSTGRES_DB: zipimoney
      POSTGRES_USER: zipimoney
      POSTGRES_PASSWORD: zipimoney_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: zipimoney
    container_name: zipimoney-app
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: zipimoney
      DB_USERNAME: zipimoney
      DB_PASSWORD: zipimoney_local
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

volumes:
  pgdata:
