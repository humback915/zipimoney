spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    kr.zipimoney: INFO
    org.hibernate.SQL: WARN
